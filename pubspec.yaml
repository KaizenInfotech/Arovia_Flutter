name: arovia
description: "A new Flutter project."
publish_to: 'none'
version: 3.0.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2  
  firebase_core: ^3.12.0
  firebase_analytics: ^11.4.3
  firebase_remote_config: ^5.4.1
  firebase_messaging: ^15.2.3
  http: ^1.3.0
  shared_preferences: ^2.5.2
  device_info_plus: ^11.3.0
  url_launcher: ^6.3.1
  dio: ^5.4.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  open_file: ^3.2.1
  flutter_file_dialog: ^3.0.2
  flutter_inappwebview: ^6.1.5
  package_info_plus: ^8.3.0
  cached_network_image: ^3.4.1
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.11
  webview_flutter_wkwebview: ^3.23.5
  connectivity_plus: ^7.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
   - assets/arovia_logo.png
   - assets/doctor.png
   - assets/nurse.png
   - assets/get_start_nurse.png
   - assets/get_start_doc.png
   - assets/notify_icon.png
   - assets/bell_icon.png
   - assets/rupee.png
   - assets/calendar.png
   - assets/sandclock.png
   - assets/status.png
   - assets/splash.png
   - assets/app_logo.png
   - assets/logout.png
